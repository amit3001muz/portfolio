<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amit Kumar | DevOps Engineer</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            color: #58a6ff;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        h2 {
            color: #8b949e;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .badge {
            background: #21262d;
            border: 1px solid #30363d;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
            margin: 4px;
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 24px;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Amit Kumar</h1>
        <h2>DevOps & Cloud Engineer</h2>
        <p>I build secure, reliable, and scalable infrastructure using Azure, Kubernetes, and Terraform.</p>
        <div>
            <span class="badge">Azure</span>
            <span class="badge">Kubernetes (AKS)</span>
            <span class="badge">Terraform</span>
            <span class="badge">CI/CD</span>
            <span class="badge">DevSecOps</span>
        </div>
        <br>
        <a href="https://linkedin.com" target="_blank" class="btn">Connect on LinkedIn</a>
    </div>
</body>
</html>
